<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>画像|まなびみらい市</title>
        <link rel="stylesheet" href="../main.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <div class="topbar">
            <a id="title" href="/docs/" class="linkButton">まなびみらい市</a>
            <nav>
                <a class="navContent linkButton" href="/docs/index.html"
                    >トップ</a
                >
                <a class="navContent linkButton" href="/docs/photos/index.html"
                    >画像</a
                >
                <a
                    class="navContent linkButton"
                    href="/docs/facilities/index.html"
                    >施設紹介</a
                >
            </nav>
        </div>
        <div class="photos">
            <h1>画像</h1>
            <figure>
                <div class="imgAndName">
                    <h2>ビオトープ</h2>
                    <img src="../assets/biotope.webp" alt="ビオトープ" />
                </div>
                <figcaption>
                    町の中にあるビオトープ。都会でも自然の営みを感じることができる。
                </figcaption>
            </figure>
            <figure>
                <div class="imgAndname">
                    <h2>コンビニ</h2>
                    <img src="../assets/mart.webp" alt="コンビニエンスストア" />
                </div>
                <figcaption>
                    コンビニエンスストア。過剰な照明を抑えて、落ち付いた雰囲気になっている。
                </figcaption>
            </figure>
            <figure>
                <div class="imgAndname">
                    <h2>町並み</h2>
                    <img src="../assets/tower.webp" alt="タワー" />
                </div>
                <figcaption>
                    路面電車の奥には3つのビルと展望台が見える。コンパクトシティで、少子高齢化による人口減少を見据えている。
                </figcaption>
            </figure>
        </div>
    </body>
</html>
